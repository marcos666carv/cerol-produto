<!-- TELA: Configurações · notificações, privacidade LGPD e preferências · sem tabbar -->
<figure class="g-cell" id="tela-config">
  <div class="c-phone">
    <div class="c-status"><span>9:41</span><span class="not"></span><span class="t-num">5G ▮▮▮</span></div>
    <div class="c-screen">

      <header class="c-appbar">
        <a class="c-chip c-chip--ghost" href="#"><svg class="ic"><use href="#i-chev"/></svg></a>
        <h1 class="t-h1">Configurações</h1>
      </header>

      <section class="c-tile">
        <div class="c-tile__cap"><span class="t-label">Notificações</span></div>
        <div class="c-list">
          <div class="c-row">
            <span class="c-row__body"><b>Liga e ranking</b></span>
            <span class="c-toggle is-on"></span>
          </div>
          <div class="c-row">
            <span class="c-row__body"><b>Lembretes de reserva</b></span>
            <span class="c-toggle is-on"></span>
          </div>
          <div class="c-row">
            <span class="c-row__body"><b>Desafios</b></span>
            <span class="c-toggle"></span>
          </div>
        </div>
      </section>

      <section class="c-tile">
        <div class="c-tile__cap"><span class="t-label">Privacidade · LGPD</span></div>
        <div class="c-list">
          <div class="c-row">
            <span class="c-row__body"><b>Disponível para jogar</b><span>posição aproximada ~500 m — nunca o local exato</span></span>
            <span class="c-toggle is-on"></span>
          </div>
          <div class="c-row">
            <svg class="ic ic--s"><use href="#i-arrow"/></svg>
            <span class="c-row__body"><b>Baixar meus dados</b></span>
            <span class="c-row__end"><svg class="ic ic--s t-muted"><use href="#i-chev"/></svg></span>
          </div>
          <div class="c-row">
            <span class="c-row__body"><b>Consentimentos</b></span>
            <span class="c-row__end"><svg class="ic ic--s t-muted"><use href="#i-chev"/></svg></span>
          </div>
          <div class="c-row">
            <span class="c-row__body"><b style="color:var(--clay)">Apagar conta</b></span>
            <span class="c-row__end"><svg class="ic ic--s t-muted"><use href="#i-chev"/></svg></span>
          </div>
        </div>
      </section>

      <section class="c-tile c-tile--flat">
        <div class="c-list">
          <div class="c-row">
            <span class="c-row__body"><b>Unidades</b></span>
            <span class="c-chip c-chip--ghost">km</span>
          </div>
          <div class="c-row">
            <span class="c-row__body"><b>Idioma</b></span>
            <span class="c-chip c-chip--ghost">PT-BR</span>
          </div>
          <div class="c-row">
            <span class="c-row__body"><b>Ajuda e suporte</b></span>
            <span class="c-row__end"><svg class="ic ic--s t-muted"><use href="#i-chev"/></svg></span>
          </div>
        </div>
      </section>

      <button class="c-btn c-btn--ghost c-btn--block">Sair</button>

    </div>
  </div>
  <figcaption><b>Configurações</b>Notificações granulares, bloco de privacidade LGPD (disponibilidade com posição aproximada de ~500 m, download de dados, consentimentos e apagar conta) e preferências gerais. Sem tabbar — subtela do Perfil.</figcaption>
</figure>
