<!-- TELA: Sheet do FAB Jogar · fluxo F4 · composta só com componentes de ds.css -->
<figure class="g-cell" id="tela-jogar-sheet">
  <div class="c-phone">
    <div class="c-status"><span>9:41</span><span class="not"></span><span class="t-num">5G ▮▮▮</span></div>
    <div class="c-screen">

      <section class="c-tile c-tile--pine" style="opacity:.3">
        <div class="c-tile__cap"><span class="t-label">Sua liga · Divisão Ouro</span></div>
        <span class="t-num-l">4º</span>
      </section>

      <section class="c-tile" style="opacity:.3">
        <div class="c-tile__cap"><span class="t-label">Últimos jogos</span></div>
        <div class="c-list">
          <div class="c-row">
            <span class="c-res c-res--v">V</span>
            <span class="c-row__body"><b>6-4 · 6-3 vs Pedro</b><span>simples · Clube Saibro</span></span>
            <span class="c-row__end t-num t-small"><b>+120 XP</b></span>
          </div>
        </div>
      </section>

      <div class="c-sheet">
        <div class="c-sheet__handle"></div>
        <div class="u-col">
          <span class="t-label">O que vamos jogar?</span>
          <a class="c-opt" href="#">
            <svg class="ic"><use href="#i-timer"/></svg>
            <span class="u-grow u-col u-gap1"><b>Registrar sessão</b><span class="t-small t-muted">timer, contador ou Apple Saúde</span></span>
          </a>
          <a class="c-opt" href="#">
            <svg class="ic"><use href="#i-racket"/></svg>
            <span class="u-grow u-col u-gap1"><b>Registrar partida</b><span class="t-small t-muted">placar → validação bilateral</span></span>
          </a>
          <a class="c-opt" href="#">
            <svg class="ic"><use href="#i-users"/></svg>
            <span class="u-grow u-col u-gap1"><b>Abrir match</b><span class="t-small t-muted">adversário do seu nível, perto de você</span></span>
          </a>
          <a class="c-opt" href="#">
            <svg class="ic"><use href="#i-cal"/></svg>
            <span class="u-grow u-col u-gap1"><b>Reservar quadra</b><span class="t-small t-muted">clubes parceiros e quadras públicas</span></span>
          </a>
          <button class="c-btn c-btn--ghost c-btn--s c-btn--block">Fechar</button>
        </div>
      </div>

    </div>
  </div>
  <figcaption><b>Jogar (sheet do FAB)</b>Bolinha central abre o hub de ação com as 4 portas do produto: sessão, partida, match e reserva. A home fica esmaecida ao fundo enquanto o sheet gruda na base.</figcaption>
</figure>
