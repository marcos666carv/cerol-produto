<!-- TELA: Detalhe do produto (roupa) · composta só com componentes de ds.css -->
<figure class="g-cell" id="tela-produto">
  <div class="c-phone">
    <div class="c-status"><span>9:41</span><span class="not"></span><span class="t-num">5G ▮▮▮</span></div>
    <div class="c-screen">

      <header class="c-appbar">
        <span class="c-chip c-chip--ghost"><svg class="ic"><use href="#i-x"/></svg></span>
        <h2 class="t-h2">Camiseta Bola Dentro</h2>
      </header>

      <section class="c-tile c-tile--ink c-courtbg c-tile--center">
        <svg class="ic" style="width:72px;height:72px;color:var(--acid)"><use href="#i-shirt"/></svg>
        <span class="u-flex u-gap2">
          <span class="c-chip c-chip--acid">Bola Dentro</span>
          <span class="c-chip c-chip--ghost" style="color:#fff;border-color:rgba(255,255,255,.35)">unissex</span>
        </span>
      </section>

      <section class="c-tile">
        <p class="t-small">Algodão pesado com a bolinha em serigrafia acid nas costas. Feita para o pós-jogo — e para o feed do clube.</p>
        <span class="t-label">Tamanho</span>
        <div class="c-slots">
          <span class="c-slot">P</span>
          <span class="c-slot is-on">M</span>
          <span class="c-slot">G</span>
          <span class="c-slot">GG</span>
        </div>
        <div class="u-between">
          <div class="c-price"><b class="t-num">R$ 129</b><span>frete grátis</span></div>
          <span class="c-chip"><svg class="ic t-ball"><use href="#i-ball"/></svg>não usa Bolinhas</span>
        </div>
      </section>

      <div class="c-tile c-tile--flat">
        <p class="t-micro t-muted">Troca em até 30 dias · pagamento pelo gateway seguro (cartão, Pix ou carteira do aparelho).</p>
      </div>

      <div class="u-col u-gap2" style="margin-top:auto">
        <button class="c-btn c-btn--block">Comprar · R$ 129</button>
        <button class="c-btn c-btn--ghost c-btn--block"><svg class="ic"><use href="#i-gift"/></svg>Presentear um amigo</button>
      </div>

    </div>
  </div>
  <figcaption><b>Detalhe do produto</b>Roupa com seletor de tamanho (slots), preço em R$ com frete, separação clara das Bolinhas e CTA com o valor no botão, ancorado na base.</figcaption>
</figure>
