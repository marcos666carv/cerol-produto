<!-- TELA: Reservar quadra · Clube Saibro · slots + pagamento Pix · sem tabbar -->
<figure class="g-cell" id="tela-quadra">
  <div class="c-phone">
    <div class="c-status"><span>9:41</span><span class="not"></span><span class="t-num">5G ▮▮▮</span></div>
    <div class="c-screen">

      <header class="c-appbar">
        <a class="c-chip c-chip--ghost" href="#"><svg class="ic"><use href="#i-x"/></svg></a>
        <h1 class="t-h2">Clube Saibro</h1>
        <span class="c-chip c-chip--ink u-right t-num">R$ 60/h</span>
      </header>

      <div class="u-flex">
        <span class="c-chip c-chip--ghost">saibro</span>
        <span class="c-chip c-chip--ghost t-num">1,2 km</span>
        <span class="c-chip c-chip--ghost"><svg class="ic"><use href="#i-star"/></svg><b class="t-num">4,8</b></span>
      </div>

      <div class="c-seg">
        <span>Hoje</span>
        <span class="is-on">Sex 31</span>
        <span>Sáb 1</span>
      </div>

      <span class="t-label">Horários</span>
      <div class="c-slots">
        <span class="c-slot is-off">17:00</span>
        <span class="c-slot is-off">18:00</span>
        <span class="c-slot is-on">19:00</span>
        <span class="c-slot">20:00</span>
        <span class="c-slot">21:00</span>
        <span class="c-slot">07:00</span>
        <span class="c-slot">08:00</span>
        <span class="c-slot">09:00</span>
      </div>

      <label class="c-opt">
        <svg class="ic"><use href="#i-users"/></svg>
        <b class="t-small u-grow">Convidar parceiro ou abrir match</b>
        <span class="c-toggle"></span>
      </label>

      <section class="c-tile c-tile--flat">
        <div class="u-between">
          <b class="t-small t-num">Sex 31 · 19:00 – 20:00</b>
          <span class="c-price"><b>R$ 60</b><span>Pix</span></span>
        </div>
      </section>

      <button class="c-btn c-btn--block"><svg class="ic"><use href="#i-pix"/></svg>Confirmar e pagar</button>
      <div class="u-center"><span class="t-micro t-muted">+300 XP no check-in por geofence · cancelamento grátis até 12h antes</span></div>

    </div>
  </div>
  <figcaption><b>Reservar quadra</b>Fluxo de reserva do Clube Saibro: dia em segmentos, grade de horários (ocupados riscados), toggle para transformar a reserva em match e pagamento Pix em um toque.</figcaption>
</figure>
