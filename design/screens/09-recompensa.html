<!-- TELA: Recompensa pós-sessão · celebração de XP, sem tabbar · composta só com componentes de ds.css -->
<figure class="g-cell" id="tela-recompensa">
  <div class="c-phone">
    <div class="c-status"><span>9:41</span><span class="not"></span><span class="t-num">5G ▮▮▮</span></div>
    <div class="c-screen">

      <p class="t-label u-center">Sessão registrada · <span class="t-num">46min</span></p>

      <section class="c-tile c-tile--acid">
        <div class="u-center"><span class="t-num-xl">+130 XP</span></div>
        <div class="u-center"><span class="c-chip c-chip--ink"><svg class="ic"><use href="#i-zap"/></svg>Crítico do dia ×1,5</span></div>
        <div class="c-bar"><i style="width:82%"></i></div>
        <div class="u-center"><span class="t-micro">Nível 12 · faltam 240 XP para o 13</span></div>
      </section>

      <div class="u-grid2">
        <section class="c-tile">
          <div class="c-stat">
            <span class="t-label">Bolinhas</span>
            <div class="c-stat__v"><span class="t-num-l">+25</span><svg class="ic" style="color:var(--lime)"><use href="#i-ball"/></svg></div>
          </div>
        </section>
        <section class="c-tile">
          <div class="c-stat">
            <span class="t-label">Sequência</span>
            <div class="c-stat__v"><span class="t-num-l">13</span><svg class="ic" style="color:var(--clay)"><use href="#i-flame"/></svg></div>
          </div>
        </section>
      </div>

      <section class="c-tile c-tile--pine">
        <span class="t-label">Liga · Divisão Ouro</span>
        <div class="u-between">
          <span class="t-small t-num">680 → 810 PL</span>
          <span class="c-delta">4º → 3º</span>
        </div>
      </section>

      <button style="margin-top:auto" class="c-btn c-btn--block"><svg class="ic"><use href="#i-share"/></svg>Compartilhar no clube</button>
      <button class="c-btn c-btn--ghost c-btn--block">Fechar</button>

    </div>
  </div>
  <figcaption><b>Recompensa pós-sessão</b>Celebração em acid com XP, crítico do dia, Bolinhas ganhas, Sequência e movimento na liga. Compartilhar alimenta o feed do clube.</figcaption>
</figure>
