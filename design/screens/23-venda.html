<!-- TELA: Venda concluída (produto físico a caminho) · composta só com componentes de ds.css -->
<figure class="g-cell" id="tela-venda">
  <div class="c-phone">
    <div class="c-status"><span>9:41</span><span class="not"></span><span class="t-num">5G ▮▮▮</span></div>
    <div class="c-screen">

      <section class="c-tile c-tile--acid c-tile--center">
        <span class="c-medal"><svg class="ic"><use href="#i-check"/></svg></span>
        <h1 class="t-h1">Pedido confirmado!</h1>
        <p class="t-small">Camiseta Bola Dentro · M está a caminho.</p>
        <span class="u-flex u-wrap u-gap2 u-center">
          <span class="c-chip c-chip--ink t-num">R$ 129</span>
          <span class="c-chip"><svg class="ic"><use href="#i-card"/></svg>Visa •••• 6411</span>
        </span>
      </section>

      <section class="c-tile">
        <div class="c-list">
          <div class="c-row">
            <span class="c-row__lead"><svg class="ic ic--s"><use href="#i-qr"/></svg></span>
            <span class="c-row__body"><b>Pedido #4821</b><span>30 jul 2026 · 09:12 · recibo por e-mail</span></span>
            <span class="c-row__end"><span class="c-chip c-chip--ghost">recibo</span></span>
          </div>
          <div class="c-row">
            <span class="c-row__lead"><svg class="ic ic--s"><use href="#i-pin"/></svg></span>
            <span class="c-row__body"><b>Chega entre 4 e 6 de agosto</b><span>Rua das Gaivotas 88 · rastreio por notificação</span></span>
          </div>
        </div>
      </section>

      <section class="c-tile c-tile--pine">
        <span class="t-label">Estreia em quadra</span>
        <div class="u-between">
          <p class="t-small" style="font-weight:700">Estreie a camiseta num match — check-in presencial vale +300 XP.</p>
          <span class="c-chip c-chip--acid">Abrir match</span>
        </div>
      </section>

      <div class="u-col u-gap2" style="margin-top:auto">
        <button class="c-btn c-btn--block">Acompanhar pedido</button>
        <button class="c-btn c-btn--ghost c-btn--block">Voltar à loja</button>
      </div>

    </div>
  </div>
  <figcaption><b>Venda concluída</b>Celebração em acid, comprovante (pedido, recibo, método) e entrega com prazo/rastreio. O tile pine devolve o jogador ao loop: estrear a compra num match vale XP presencial.</figcaption>
</figure>
