<!-- TELA: Sessão manual retroativa · fluxo F3 · composta só com componentes de ds.css -->
<figure class="g-cell" id="tela-sessao-manual">
  <div class="c-phone">
    <div class="c-status"><span>9:41</span><span class="not"></span><span class="t-num">5G ▮▮▮</span></div>
    <div class="c-screen">

      <header class="c-appbar">
        <span class="t-h1">Sessão retroativa</span>
        <a class="c-chip u-right" href="#"><svg class="ic ic--s"><use href="#i-x"/></svg></a>
      </header>

      <div class="c-field">
        <span class="t-label">Quando</span>
        <div class="c-slots c-slots--3">
          <span class="c-slot is-on">Hoje</span>
          <span class="c-slot">Ontem</span>
          <span class="c-slot">Escolher data</span>
        </div>
      </div>

      <div class="c-field">
        <span class="t-label">Duração</span>
        <div class="c-slots">
          <span class="c-slot">30min</span>
          <span class="c-slot is-on">45min</span>
          <span class="c-slot">60min</span>
          <span class="c-slot">90min</span>
        </div>
      </div>

      <div class="c-field">
        <span class="t-label">Tipo</span>
        <div class="c-seg">
          <span class="is-on">Treino livre</span>
          <span>Paredão</span>
          <span>Aula</span>
          <span>Físico</span>
        </div>
      </div>

      <div class="c-field">
        <span class="t-label">Local</span>
        <label class="c-input"><svg class="ic"><use href="#i-pin"/></svg>Clube Saibro</label>
      </div>

      <div class="c-tile c-tile--flat">
        <span class="t-micro t-muted">Auto-relato conta para XP (teto <b class="t-num">400</b>/dia) e nunca altera o rating — rating só muda com partida validada.</span>
      </div>

      <button style="margin-top:auto" class="c-btn c-btn--block">Salvar sessão · +50 XP</button>

    </div>
  </div>
  <figcaption><b>Sessão retroativa</b>Registro manual em 4 escolhas rápidas: quando, duração, tipo e local. O aviso anti-farm deixa claro que auto-relato rende XP mas nunca mexe no rating.</figcaption>
</figure>
