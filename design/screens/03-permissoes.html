<!-- TELA: Permissões com racional · onboarding · composta só com componentes de ds.css -->
<figure class="g-cell" id="tela-permissoes">
  <div class="c-phone">
    <div class="c-status"><span>9:41</span><span class="not"></span><span class="t-num">5G ▮▮▮</span></div>
    <div class="c-screen">

      <header class="u-col u-gap2">
        <span class="t-label">Cadastro · quase lá</span>
        <div class="c-bar"><i style="width:83%"></i></div>
      </header>

      <h1 class="t-h1">Para o jogo funcionar</h1>

      <label class="c-opt u-flex">
        <svg class="ic"><use href="#i-bell"/></svg>
        <span class="u-grow u-col u-gap1"><b>Notificações</b><span class="t-small t-muted">É assim que a liga te avisa</span></span>
        <span class="c-toggle is-on"></span>
      </label>

      <label class="c-opt u-flex">
        <svg class="ic"><use href="#i-pin"/></svg>
        <span class="u-grow u-col u-gap1"><b>Localização</b><span class="t-small t-muted">Quadras e jogos perto de você — posição nunca é exata em público</span></span>
        <span class="c-toggle is-on"></span>
      </label>

      <label class="c-opt u-flex">
        <svg class="ic"><use href="#i-heart"/></svg>
        <span class="u-grow u-col u-gap1"><b>Apple Saúde</b><span class="t-small t-muted">Registre treinos sem esforço</span></span>
        <span class="c-toggle"></span>
      </label>

      <div class="c-tile c-tile--flat">
        <p class="t-micro t-muted">Cadastro 18+ · consentimentos versionados · você controla tudo em Configurações</p>
      </div>

      <button style="margin-top:auto" class="c-btn c-btn--block">Continuar</button>

    </div>
  </div>
  <figcaption><b>Permissões</b>Cada permissão vem com o racional em uma linha — o pedido é explicado, nunca imposto. Saúde começa desligada; tudo é reversível em Configurações.</figcaption>
</figure>
