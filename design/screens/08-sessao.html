<!-- TELA: Sessão em andamento · timer ao vivo, sem tabbar · composta só com componentes de ds.css -->
<figure class="g-cell" id="tela-sessao">
  <div class="c-phone">
    <div class="c-status"><span>9:41</span><span class="not"></span><span class="t-num">5G ▮▮▮</span></div>
    <div class="c-screen">

      <header class="c-appbar">
        <span class="t-label">Sessão em andamento</span>
        <span class="c-chip c-chip--acid u-right"><svg class="ic"><use href="#i-timer"/></svg>AO VIVO</span>
      </header>

      <section class="c-tile c-tile--pine c-courtbg">
        <span class="t-num-xl">00:42:18</span>
        <div class="c-ticks c-ticks--bars">
          <i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i></i><i></i><i></i><i></i><i></i>
        </div>
        <div class="u-flex">
          <span class="c-chip c-chip--acid">Treino livre</span>
          <span class="c-chip c-chip--ghost">Clube Saibro</span>
        </div>
      </section>

      <section class="c-tile">
        <div class="c-tile__cap">
          <span class="t-label">Contador de saques</span>
          <span class="c-chip c-chip--lime"><svg class="ic"><use href="#i-plus"/></svg><b>+1</b></span>
        </div>
        <div class="c-stat">
          <div class="c-stat__v"><span class="t-num-xl">34</span><span class="t-small t-muted">acertos na área</span></div>
        </div>
      </section>

      <section class="c-tile c-tile--flat">
        <div class="c-row">
          <span class="c-row__lead"><svg class="ic"><use href="#i-target"/></svg></span>
          <span class="c-row__body"><b>Missão Saque E3</b><span>20 de 30 na área de duplas</span></span>
          <span class="c-row__end"><span class="c-ticks"><i class="on"></i><i class="on"></i><i class="on"></i><i></i><i></i></span></span>
        </div>
      </section>

      <button style="margin-top:auto" class="c-btn c-btn--ink c-btn--block">Encerrar sessão</button>
      <button class="c-btn c-btn--ghost c-btn--block">Pausar</button>

    </div>
  </div>
  <figcaption><b>Sessão em andamento</b>Timer ao vivo em painel pine com contador manual de saques e progresso da missão ativa. Encerrar leva direto à cena de recompensa.</figcaption>
</figure>
