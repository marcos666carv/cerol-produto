<!-- TELA: Splash/Login · fundo animado com os atletas + zoom na bolinha · composta só com componentes de ds.css -->
<figure class="g-cell" id="tela-login">
  <div class="c-phone">
    <div class="c-loginbg" aria-hidden="true">
      <video src="img/login-bg.mp4" autoplay muted loop playsinline></video>
    </div>
    <div class="c-status" style="position:relative;z-index:2;color:#fff"><span>9:41</span><span class="not"></span><span class="t-num">5G ▮▮▮</span></div>
    <div class="c-screen" style="position:relative;z-index:2">

      <div class="u-center u-gap2" style="color:#fff;padding-top:6px">
        <svg class="ic ic--l" style="color:var(--acid)"><use href="#i-ball"/></svg>
        <span class="t-display" style="font-size:30px">CEROL</span>
      </div>
      <div class="u-center"><span class="c-chip c-chip--ghost" style="color:rgba(255,255,255,.85);border-color:rgba(255,255,255,.3)">Tênis · Beach Tennis</span></div>

      <div class="u-col u-gap1" style="color:#fff;margin-top:10px">
        <h1 class="t-display" style="font-size:38px">Todo treino<br>vira jogo.</h1>
        <p class="t-small" style="color:rgba(255,255,255,.75);max-width:30ch">XP por constância, liga semanal, rating validado e medalhas de verdade.</p>
      </div>

      <div class="u-col u-gap2" style="margin-top:auto">
        <div class="u-grid3">
          <div class="c-topic"><svg class="ic"><use href="#i-zap"/></svg>+50 XP por sessão</div>
          <div class="c-topic"><svg class="ic"><use href="#i-trophy"/></svg>Liga toda semana</div>
          <div class="c-topic"><svg class="ic"><use href="#i-medal"/></svg>Medalha física</div>
        </div>
        <div class="u-flex u-gap2">
          <button class="c-btn c-btn--ink u-grow" aria-label="Continuar com Apple"><svg class="ic"><use href="#i-apple"/></svg></button>
          <button class="c-btn c-btn--card u-grow" aria-label="Continuar com Google"><svg class="ic"><use href="#i-google"/></svg></button>
        </div>
        <button class="c-btn c-btn--ghost c-btn--block" style="border-color:rgba(255,255,255,.45);color:#fff">Entrar com e-mail</button>
        <p class="t-micro u-center" style="color:rgba(255,255,255,.6)"><span><b class="t-num">18+</b> no MVP · seus dados seguem a LGPD</span></p>
      </div>

    </div>
  </div>
  <figcaption><b>Splash / Login</b>Fundo animado em loop de 16s: os 4 atletas se revezam com pans e zooms diferentes e, na virada do meio, a bolinha toma a tela. Texto direto no fundo, tópicos lado a lado (ícone em cima) e entrada só com os ícones Apple/Google.</figcaption>
</figure>
