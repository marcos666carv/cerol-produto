<!-- TELA: Checkout · gateway de pagamento (produto físico) · composta só com componentes de ds.css -->
<figure class="g-cell" id="tela-checkout">
  <div class="c-phone">
    <div class="c-status"><span>9:41</span><span class="not"></span><span class="t-num">5G ▮▮▮</span></div>
    <div class="c-screen">

      <header class="c-appbar">
        <span class="c-chip c-chip--ghost"><svg class="ic"><use href="#i-x"/></svg></span>
        <h2 class="t-h2">Pagamento</h2>
      </header>

      <section class="c-tile">
        <div class="c-list">
          <div class="c-row">
            <span class="c-row__lead"><svg class="ic"><use href="#i-shirt"/></svg></span>
            <span class="c-row__body"><b>Camiseta Bola Dentro · M</b><span>entrega: Rua das Gaivotas 88, Floripa · 3–5 dias</span></span>
            <span class="c-row__end t-num t-small"><b>R$ 129</b></span>
          </div>
        </div>
      </section>

      <span class="t-label">Como você quer pagar</span>
      <div class="u-col u-gap2">
        <div class="c-opt is-on">
          <svg class="ic"><use href="#i-card"/></svg>
          <span class="u-grow u-col u-gap1"><b class="t-small">Visa •••• 6411</b><span class="t-micro t-muted">principal · 1 toque</span></span>
          <svg class="ic ic--s"><use href="#i-check"/></svg>
        </div>
        <div class="c-opt">
          <svg class="ic"><use href="#i-pix"/></svg>
          <span class="u-grow u-col u-gap1"><b class="t-small">Pix</b><span class="t-micro t-muted">QR na hora · sem cadastro</span></span>
        </div>
        <div class="c-opt">
          <svg class="ic"><use href="#i-wallet"/></svg>
          <span class="u-grow u-col u-gap1"><b class="t-small">Carteira do aparelho</b><span class="t-micro t-muted">Apple Pay · Google Pay</span></span>
        </div>
      </div>

      <div class="c-tile c-tile--flat">
        <p class="t-micro t-muted">Gateway seguro: o app nunca vê o número do cartão — só bandeira e final. PCI no gateway, dados sob LGPD.</p>
      </div>

      <section class="c-tile">
        <div class="u-between"><span class="t-small t-muted">Produto</span><span class="t-num t-small">R$ 129</span></div>
        <div class="u-between"><span class="t-small t-muted">Frete</span><span class="t-num t-small">grátis</span></div>
        <div class="u-between"><span class="t-small t-muted">Total</span><span class="t-num-l">R$ 129</span></div>
      </section>

      <div class="u-col u-gap2" style="margin-top:auto">
        <button class="c-btn c-btn--block"><svg class="ic"><use href="#i-check"/></svg>Pagar R$ 129</button>
        <p class="t-micro t-muted u-center"><span>Confirmação com a biometria do aparelho</span></p>
      </div>

    </div>
  </div>
  <figcaption><b>Checkout (gateway)</b>Item com tamanho e endereço de entrega, seleção de método (cartão tokenizado, Pix, carteira), nota PCI/LGPD, resumo com frete e pagamento com biometria — fluxo F8.</figcaption>
</figure>
