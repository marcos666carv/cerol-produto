<!-- TELA: Abrir match · fluxo de criação de partida · sem tabbar · só componentes de ds.css -->
<figure class="g-cell" id="tela-match">
  <div class="c-phone">
    <div class="c-status"><span>9:41</span><span class="not"></span><span class="t-num">5G ▮▮▮</span></div>
    <div class="c-screen">

      <header class="c-appbar">
        <span class="c-chip c-chip--ghost"><svg class="ic"><use href="#i-x"/></svg></span>
        <span class="t-h2">Abrir match</span>
      </header>

      <div class="c-seg">
        <span class="is-on">Simples</span>
        <span>Duplas</span>
        <span>Racha</span>
      </div>

      <div class="u-flex">
        <span class="c-chip c-chip--ink">Tênis</span>
        <span class="c-chip c-chip--ghost">Beach</span>
      </div>

      <section class="c-tile">
        <span class="t-label">Nível do adversário</span>
        <div class="u-between">
          <span class="t-num-l">2.7 – 3.7</span>
          <span class="c-chip c-chip--acid">seu rating ±0.5</span>
        </div>
        <div class="c-ticks c-ticks--bars">
          <i></i><i></i><i></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i></i><i></i><i></i><i></i><i></i>
        </div>
      </section>

      <a class="c-opt" href="#">
        <svg class="ic"><use href="#i-pin"/></svg>
        <span class="u-grow u-col u-gap1"><b class="t-body">Clube Saibro ou raio de <span class="t-num">5 km</span></b><span class="t-small t-muted">local exato só após confirmar</span></span>
        <svg class="ic"><use href="#i-chev"/></svg>
      </a>

      <a class="c-opt" href="#">
        <svg class="ic"><use href="#i-cal"/></svg>
        <span class="u-grow u-col u-gap1"><b class="t-body">Sábado de manhã</b><span class="t-small t-muted">janela flexível</span></span>
        <svg class="ic"><use href="#i-chev"/></svg>
      </a>

      <section class="u-col u-gap2">
        <span class="t-label">Visibilidade</span>
        <div class="c-seg">
          <span class="is-on">Público</span>
          <span>Clube</span>
          <span>Amigos</span>
        </div>
      </section>

      <button style="margin-top:auto" class="c-btn c-btn--block"><svg class="ic"><use href="#i-arrow"/></svg>Publicar match</button>
      <p class="t-micro t-muted u-center">Jogadores compatíveis por rating e distância recebem notificação.</p>

    </div>
  </div>
  <figcaption><b>Abrir match</b>Criação de partida em uma tela só: formato, esporte, faixa de rating (±0.5 do jogador), local e janela de horário flexíveis, visibilidade e publicação. O local exato só aparece após confirmação mútua.</figcaption>
</figure>
